<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sauze 3D</title>

<link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet"/>

<style>
html, body { margin:0; height:100% }
#map { height:100%; background:#0b1220; }

.panel{
  position:absolute; left:12px; top:12px; z-index:30;
  background:rgba(255,255,255,0.95);
  padding:12px; border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
  font-family:system-ui,Arial;
  width:320px;
}

.row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px }

button{
  border:0; border-radius:10px; padding:8px 10px;
  font-weight:900; cursor:pointer;
}

.btn-dark{ background:#111; color:#fff }
.btn-light{ background:#eee; color:#111 }

.msg{
  position:absolute;
  left:12px;
  right:12px;
  bottom:12px;
  z-index:5;
  background:rgba(0,0,0,0.8);
  color:#fff;
  padding:10px;
  border-radius:12px;
  text-align:center;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="panel">
  <div style="font-weight:1000;">🏔️ Sauze 3D</div>

  <div class="row">
    <button class="btn-dark" id="btnBack2D">↩︎ Torna 2D</button>
  </div>

  <div class="row">
    <button class="btn-light" id="btnMap">🗺️ Mappa</button>
    <button class="btn-dark" id="btnSat">🛰️ Satellite</button>
  </div>
</div>

<div class="msg">Tutti i diritti sono riservati a Mattia R.</div>

<script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>

<script>
const MAPTILER_KEY = "ORUgXv14fwE911CA6MdX";

const map = new maplibregl.Map({
  container:"map",
  style:{
    version:8,
    sources:{
      carto:{
        type:"raster",
        tiles:["https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png"],
        tileSize:256
      },
      sat:{
        type:"raster",
        tiles:[`https://api.maptiler.com/tiles/satellite-v2/{z}/{x}/{y}.jpg?key=${MAPTILER_KEY}`],
        tileSize:256
      }
    },
    layers:[
      {id:"base", type:"raster", source:"carto"},
      {id:"satellite", type:"raster", source:"sat", layout:{visibility:"none"}}
    ]
  },
  center:[6.86,45.03],
  zoom:12,
  pitch:60,
  bearing:-20
});

map.addControl(new maplibregl.NavigationControl(), "top-right");

map.on("load", () => {

  // PISTE
  map.addSource("runs",{type:"geojson",data:"./sauze_doulx.geojson"});

  map.addLayer({
    id:"runs",
    type:"line",
    source:"runs",
    paint:{
      "line-color":"red",
      "line-width":4
    }
  });

  // RIFUGI
  map.addSource("rifugi",{type:"geojson",data:"./data/rifugi.geojson"});

  map.addLayer({
    id:"rifugi",
    type:"circle",
    source:"rifugi",
    paint:{
      "circle-radius":6,
      "circle-color":"yellow"
    }
  });

  // IMPIANTI
  map.addSource("impianti",{type:"geojson",data:"./data/impianti.geojson"});

  map.addLayer({
    id:"impianti",
    type:"circle",
    source:"impianti",
    paint:{
      "circle-radius":6,
      "circle-color":"blue"
    }
  });

});

// BOTTONI
document.getElementById("btnMap").onclick = () => {
  map.setLayoutProperty("base","visibility","visible");
  map.setLayoutProperty("satellite","visibility","none");
};

document.getElementById("btnSat").onclick = () => {
  map.setLayoutProperty("base","visibility","none");
  map.setLayoutProperty("satellite","visibility","visible");
};

// FIX TORNA 2D
document.getElementById("btnBack2D").addEventListener("click", () => {
  window.location.href = "./";
});
</script>

</body>
</html>
